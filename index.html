<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Chemical Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1320px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
        .top-controls { position: absolute; top: 25px; right: 30px; display: flex; gap: 8px; }
        .chem-canvas { cursor: pointer; background: #fff; border: 1px solid #dee2e6; border-radius: 6px; }
        .cabinet-banner { display: none; background: #e8f5e9; border: 2px dashed #2e7d32; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .admin-only { display: none; }
    </style>
</head>
<body>

<div class="container position-relative">
    <div class="top-controls">
        <button class="btn btn-outline-success btn-sm" onclick="exportExcel()">📊 匯出 Excel 清冊</button>
        <button class="btn btn-outline-dark btn-sm" onclick="showAuthModal()" id="btnAuth">🔐 登入管理員</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="toggleLanguage()" id="langBtn">English</button>
    </div>

    <h2 class="text-center mb-4" id="title">🧪 實驗室藥品精密管理系統</h2>

    <!-- 相機掃描區 -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white fw-bold d-flex justify-content-between align-items-center">
            <span id="scanHeader">相機條碼掃描（支援連續批量入櫃）</span>
            <span class="badge bg-light text-primary" id="scanModeBadge">一般查詢模式</span>
        </div>
        <div class="card-body text-center">
            <div id="cabinetBanner" class="cabinet-banner">
                <h5 class="text-success fw-bold mb-1">📍 批量入櫃中：<span id="currentCabinetName">未鎖定</span></h5>
                <small class="text-muted">已鎖定目標藥櫃！接下來掃描的所有藥品將直接歸入此櫃。</small>
                <div class="mt-2">
                    <button class="btn btn-sm btn-outline-danger" onclick="exitCabinetMode()">結束入櫃模式</button>
                </div>
            </div>

            <button class="btn btn-primary w-100 mb-2" id="btnScan" onclick="toggleScanner()">開啟相機掃描</button>
            <div id="reader"></div>
            <div id="scanFeedback" class="mt-2 fw-bold text-success" style="display:none;"></div>
        </div>
    </div>

    <!-- 搜尋區 -->
    <div class="mb-4">
        <label for="searchInput" class="form-label fw-bold" id="searchLabel">🔍 藥品搜尋 (支援中英文名稱模糊搜尋、CAS No.、廠商、SMILES 結構式、條碼、擺放位置)</label>
        <div class="input-group">
            <input type="text" id="searchInput" class="form-control" placeholder="輸入中文或英文關鍵字（留空可列出所有藥品）..." onkeypress="handleKeyPress(event)">
            <button class="btn btn-dark" type="button" onclick="searchChemical()" id="btnSearch">搜尋</button>
        </div>
    </div>

    <!-- 查詢結果表格 -->
    <h4 id="resultHeader">查詢結果</h4>
    <div class="table-responsive mb-4">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th id="thBarcode">條碼</th>
                    <th id="thName">藥品名稱 (中/英)</th>
                    <th id="thCas">CAS No.</th>
                    <th id="thFormula">分子式/分子量</th>
                    <th id="thStructure">2D 化學結構</th>
                    <th id="thSafety">安衛分類</th>
                    <th id="thLocation">位置座標</th>
                    <th id="thSpec">規格</th>
                    <th id="thVendor">廠商</th>
                    <th id="thNote">備註</th>
                    <th id="thAction">操作</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <tr><td colspan="11" class="text-center text-muted" id="initialText">請點擊搜尋或輸入關鍵字</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 藥品編輯 / 新增表單區塊 -->
    <div id="formSection">
        <hr>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 id="formHeaderTitle" class="mb-0">📝 編輯已入庫藥品資料</h4>
            <span id="formRoleBadge" class="badge bg-secondary">所有人皆可編輯已入庫藥品</span>
        </div>
        <form id="addForm" onsubmit="saveChemical(event)">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold" id="lblBarcode">瓶身條碼 *</label>
                    <input type="text" id="addBarcode" class="form-control" placeholder="例如：CHEM-00001" required>
                    <small class="text-muted" id="barcodeTip">（若為新條碼入庫，需管理員權限）</small>
                </div>
                
                <div class="col-md-3">
                    <label class="form-label fw-bold" id="lblCas">CAS Number</label>
                    <div class="input-group">
                        <input type="text" id="addCas" class="form-control" placeholder="例如：64-17-5">
                        <button class="btn btn-primary" type="button" onclick="fetchPubChemByCas()" id="btnFetchCas">🔍 自動帶入</button>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-bold" id="lblName">英文名稱 *</label>
                    <input type="text" id="addName" class="form-control" placeholder="例如：Ethanol" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-bold" id="lblChineseName">中文名稱</label>
                    <input type="text" id="addChineseName" class="form-control" placeholder="例如：乙醇">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold" id="lblSmiles">SMILES 結構式</label>
                    <input type="text" id="addSmiles" class="form-control" placeholder="輸入 CAS 自動帶入或手動貼上" oninput="previewStructure()">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold" id="lblFormula">分子式 (Formula)</label>
                    <input type="text" id="addFormula" class="form-control" placeholder="例如：C2H6O">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold" id="lblMw">分子量 (MW, g/mol)</label>
                    <input type="text" id="addMw" class="form-control" placeholder="例如：46.07">
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-bold" id="lblSafety">安衛分類 *</label>
                    <input type="text" id="addSafety" list="safetyOptions" class="form-control" placeholder="可選取或直接輸入新分類" required>
                    <datalist id="safetyOptions">
                        <option value="一般藥品"></option>
                        <option value="易燃液體"></option>
                        <option value="毒性物質"></option>
                        <option value="腐蝕性物質"></option>
                        <option value="強氧化劑"></option>
                        <option value="禁水性物質"></option>
                        <option value="管制藥品"></option>
                    </datalist>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-bold" id="lblLocation">擺放位置座標 *</label>
                    <input type="text" id="addLocation" list="locationOptions" class="form-control" placeholder="可選取或直接輸入新位置" required>
                    <datalist id="locationOptions">
                        <option value="防爆櫃 A-1"></option>
                        <option value="防爆櫃 A-2"></option>
                        <option value="藥品櫃 B-1"></option>
                        <option value="藥品櫃 B-2"></option>
                        <option value="藥品櫃
