<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Chemical Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1100px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
        .lang-btn { position: absolute; top: 25px; right: 30px; }
        .chem-canvas { cursor: pointer; background: #fff; border: 1px solid #dee2e6; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container position-relative">
    <button class="btn btn-outline-secondary lang-btn btn-sm" onclick="toggleLanguage()" id="langBtn">English</button>

    <h2 class="text-center mb-4" id="title">🧪 實驗室藥品精密管理系統</h2>

    <!-- 相機掃描區 -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white fw-bold" id="scanHeader">相機條碼掃描</div>
        <div class="card-body text-center">
            <button class="btn btn-primary w-100 mb-2" id="btnScan" onclick="toggleScanner()">開啟相機掃描</button>
            <div id="reader"></div>
        </div>
    </div>

    <!-- 搜尋區 -->
    <div class="mb-4">
        <label for="searchInput" class="form-label fw-bold" id="searchLabel">🔍 藥品搜尋 (支援名稱模糊搜尋、CAS No.、SMILES 結構式、條碼、擺放位置)</label>
        <div class="input-group">
            <input type="text" id="searchInput" class="form-control" placeholder="輸入關鍵字（留空可列出所有藥品）..." onkeypress="handleKeyPress(event)">
            <button class="btn btn-dark" type="button" onclick="searchChemical()" id="btnSearch">搜尋</button>
        </div>
    </div>

    <!-- 查詢結果表格 -->
    <h4 id="resultHeader">查詢結果</h4>
    <div class="table-responsive mb-4">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th id="thBarcode">條碼</th>
                    <th id="thName">藥品名稱</th>
                    <th id="thCas">CAS No.</th>
                    <th id="thStructure">2D 化學結構</th>
                    <th id="thSafety">安衛分類</th>
                    <th id="thLocation">位置座標</th>
                    <th id="thSpec">規格</th>
                    <th id="thNote">備註</th>
                    <th id="thAction">操作</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <tr><td colspan="9" class="text-center text-muted" id="initialText">請點擊搜尋或輸入關鍵字</td></tr>
            </tbody>
        </table>
    </div>

    <hr>

    <!-- 新增 / 修改藥品建檔 -->
    <h4 class="mb-3" id="addHeader">➕ 新增 / 修改藥品建檔</h4>
    <form id="addForm" onsubmit="addChemical(event)">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-bold" id="lblBarcode">瓶身條碼 *</label>
                <input type="text" id="addBarcode" class="form-control" placeholder="例如：CHEM-00001" required>
            </div>
            
            <div class="col-md-4">
                <label class="form-label fw-bold" id="lblCas">CAS Number</label>
                <div class="input-group">
                    <input type="text" id="addCas" class="form-control" placeholder="例如：64-17-5">
                    <button class="btn btn-primary" type="button" onclick="fetchPubChemByCas()" id="btnFetchCas">🔍 自動帶入</button>
                </div>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-bold" id="lblName">藥品名稱 *</label>
                <input type="text" id="addName" class="form-control" placeholder="例如：Ethanol" required>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold" id="lblSmiles">SMILES 結構式</label>
                <input type="text" id="addSmiles" class="form-control" placeholder="輸入 CAS 點擊自動帶入，或手動貼上" oninput="previewStructure()">
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold" id="lblSafety">安衛分類 *</label>
                <input type="text" id="addSafety" list="safetyOptions" class="form-control" placeholder="可選取或直接輸入新分類" required>
                <datalist id="safetyOptions">
                    <option value="一般藥品"></option>
                    <option value="易燃液體"></option>
                    <option value="毒性物質"></option>
                    <option value="腐蝕性物質"></option>
                    <option value="強氧化劑"></option>
                    <option value="禁水性物質"></option>
                    <option value="管制藥品"></option>
                </datalist>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold" id="lblLocation">擺放位置座標 *</label>
                <input type="text" id="addLocation" list="locationOptions" class="form-control" placeholder="可選取或直接輸入新位置" required>
                <datalist id="locationOptions">
                    <option value="防爆櫃 A-1"></option>
                    <option value="防爆櫃 A-2"></option>
                    <option value="藥品櫃 B-1"></option>
                    <option value="藥品櫃 B-2"></option>
                    <option value="酸鹼櫃 C-1"></option>
                    <option value="冷藏冰箱 R-1"></option>
                    <option value="冷凍冰箱 F-1"></option>
                </datalist>
            </div>

            <!-- 2D 結構即時預覽畫布 -->
            <div class="col-12 text-center" id="previewBox" style="display:none;">
                <label class="form-label fw-bold text-success">✨ 已成功抓取 2D 分子結構預覽：</label><br>
                <canvas id="previewCanvas" width="220" height="150" class="chem-canvas shadow-sm p-2"></canvas>
            </div>

            <div class="col-md-6">
                <label class="form-label" id="lblSpec">規格 / 純度</label>
                <input type="text" id="addSpec" class="form-control" placeholder="例如：500mL / 99%">
            </div>
            <div class="col-md-6">
                <label class="form-label" id="lblNote">備註</label>
                <input type="text" id="addNote" class="form-control" placeholder="例如：開瓶日期、保管人...">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-success w-100 fw-bold" id="btnSubmit">儲存建檔 / 更新資料</button>
            </div>
        </div>
    </form>
</div>

<!-- 結構圖彈窗Modal -->
<div class="modal fade" id="structModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-3">
      <h5 id="modalTitle" class="mb-3">2D 化學結構</h5>
      <canvas id="modalCanvas" width="350" height="250" class="mx-auto"></canvas>
      <div id="modalSmiles" class="text-muted small mt-2"></div>
      <button type="button" class="btn btn-secondary mt-3" data-bs-dismiss="modal">關閉</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentLang = 'zh';
    let currentSearchResults = [];
    let html5QrCode;
    let isScanning = false;
    let smilesDrawer = new SmilesDrawer.Drawer({ width: 100, height: 70 });
    let bigDrawer = new SmilesDrawer.Drawer({ width: 350, height: 250 });

    const dict = {
        zh: {
            langBtn: "English",
            title: "🧪 實驗室藥品精密管理系統",
            scanHeader: "相機條碼掃描",
            btnScanOpen: "開啟相機掃描",
            btnScanClose: "關閉相機",
            searchLabel: "🔍 藥品搜尋 (支援名稱模糊搜尋、CAS No.、SMILES 結構式、條碼、擺放位置)",
            searchPlaceholder: "輸入關鍵字（留空可列出所有藥品）...",
            btnSearch: "搜尋",
            resultHeader: "查詢結果",
            thBarcode: "條碼",
            thName: "藥品名稱",
            thCas: "CAS No.",
            thStructure: "2D 化學結構",
            thSafety: "安衛分類",
            thLocation: "位置座標",
            thSpec: "規格",
            thNote: "備註",
            thAction: "操作",
            initialText: "請點擊搜尋或輸入關鍵字",
            searching: "搜尋中...",
            notFound: "查無相關藥品資料",
            addHeader: "➕ 新增 / 修改藥品建檔",
            lblBarcode: "瓶身條碼 *",
            lblName: "藥品名稱 *",
            lblCas: "CAS Number",
            btnFetchCas: "🔍 自動帶入",
            lblSmiles: "SMILES 結構式",
            lblSafety: "安衛分類 *",
            lblLocation: "擺放位置座標 *",
            safetyPh: "可選取或直接輸入新分類",
            locationPh: "可選取或直接輸入新位置",
            lblSpec: "規格 / 純度",
            lblNote: "備註",
            btnSubmit: "儲存建檔 / 更新資料",
            btnEdit: "編輯",
            btnDelete: "刪除",
            confirmDelete: "確定要刪除這筆藥品資料嗎？",
            saveSuccess: "儲存成功！",
            saveFail: "儲存失敗",
            connFail: "連線失敗："
        },
        en: {
            langBtn: "中文",
            title: "🧪 Precision Lab Chemical Management System",
            scanHeader: "Barcode Scanner",
            btnScanOpen: "Start Camera Scan",
            btnScanClose: "Close Camera",
            searchLabel: "🔍 Chemical Search (Fuzzy Name, CAS No., SMILES, Barcode, Location)",
            searchPlaceholder: "Type keywords (leave empty to list all)...",
            btnSearch: "Search",
            resultHeader: "Search Results",
            thBarcode: "Barcode",
            thName: "Chemical Name",
            thCas: "CAS No.",
            thStructure: "2D Structure",
            thSafety: "Safety Class",
            thLocation: "Location",
            thSpec: "Spec",
            thNote: "Note",
            thAction: "Action",
            initialText: "Click search or enter keywords",
            searching: "Searching...",
            notFound: "No matching chemical found",
            addHeader: "➕ Add / Edit Chemical",
            lblBarcode: "Bottle Barcode *",
            lblName: "Chemical Name *",
            lblCas: "CAS Number",
            btnFetchCas: "🔍 Auto-fetch",
            lblSmiles: "SMILES Structure",
            lblSafety: "Safety Class *",
            lblLocation: "Location *",
            safetyPh: "Select or type new safety class",
            locationPh: "Select or type new location",
            lblSpec: "Spec / Purity",
            lblNote: "Note",
            btnSubmit: "Save / Update Chemical",
            btnEdit: "Edit",
            btnDelete: "Delete",
            confirmDelete: "Are you sure you want to delete this chemical?",
            saveSuccess: "Saved successfully!",
            saveFail: "Failed to save",
            connFail: "Connection failed: "
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        const t = dict[currentLang];

        document.getElementById('langBtn').innerText = t.langBtn;
        document.getElementById('title').innerText = t.title;
        document.getElementById('scanHeader').innerText = t.scanHeader;
        document.getElementById('btnScan').innerText = isScanning ? t.btnScanClose : t.btnScanOpen;
        document.getElementById('searchLabel').innerText = t.searchLabel;
        document.getElementById('searchInput').placeholder = t.searchPlaceholder;
        document.getElementById('btnSearch').innerText = t.btnSearch;
        document.getElementById('resultHeader').innerText = t.resultHeader;
        document.getElementById('thBarcode').innerText = t.thBarcode;
        document.getElementById('thName').innerText = t.thName;
        document.getElementById('thCas').innerText = t.thCas;
        document.getElementById('thStructure').innerText = t.thStructure;
        document.getElementById('thSafety').innerText = t.thSafety;
        document.getElementById('thLocation').innerText = t.thLocation;
        document.getElementById('thSpec').innerText = t.thSpec;
        document.getElementById('thNote').innerText = t.thNote;
        document.getElementById('thAction').innerText = t.thAction;
        document.getElementById('addHeader').innerText = t.addHeader;
        document.getElementById('lblBarcode').innerText = t.lblBarcode;
        document.getElementById('lblName').innerText = t.lblName;
        document.getElementById('lblCas').innerText = t.lblCas;
        document.getElementById('btnFetchCas').innerText = t.btnFetchCas;
        document.getElementById('lblSmiles').innerText = t.lblSmiles;
        document.getElementById('lblSafety').innerText = t.lblSafety;
        document.getElementById('lblLocation').innerText = t.lblLocation;
        document.getElementById('addSafety').placeholder = t.safetyPh;
        document.getElementById('addLocation').placeholder = t.locationPh;
        document.getElementById('lblSpec').innerText = t.lblSpec;
        document.getElementById('lblNote').innerText = t.lblNote;
        document.getElementById('btnSubmit').innerText = t.btnSubmit;

        const initialElem = document.getElementById('initialText');
        if (initialElem) initialElem.innerText = t.initialText;

        renderResults();
    }

    async function fetchPubChemByCas() {
        const rawCas = document.getElementById('addCas').value.trim();
        const btn = document.getElementById('btnFetchCas');
        if (!rawCas) {
            alert('請先輸入 CAS Number！');
            return;
        }

        btn.innerText = '⏳ 檢索中...';
        btn.disabled = true;

        try {
            const cidUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/substance/name/${encodeURIComponent(rawCas)}/cids/JSON`;
            const cidRes = await fetch(cidUrl);
            
            if (cidRes.ok) {
                const cidData = await cidRes.json();
                const cid = cidData.IdentifierList && cidData.IdentifierList.CID ? cidData.IdentifierList.CID[0] : null;

                if (cid) {
                    const propUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/Title,CanonicalSMILES,IsomericSMILES/JSON`;
                    const propRes = await fetch(propUrl);
                    if (propRes.ok) {
                        const propData = await propRes.json();
                        const props = propData.PropertyTable.Properties[0];
                        const smiles = props.CanonicalSMILES || props.IsomericSMILES || '';
                        const name = props.Title || '';

                        if (smiles) {
                            document.getElementById('addSmiles').value = smiles;
                            previewStructure();

                            if (name && !document.getElementById('addName').value.trim()) {
                                document.getElementById('addName').value = name;
                            }
                        }
                    }
                }
            }
        } catch (err) {
            console.log('PubChem 檢索靜態完成');
        } finally {
            btn.innerText = '🔍 自動帶入';
            btn.disabled = false;
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') searchChemical();
    }

    async function searchChemical() {
        const t = dict[currentLang];
        const query = document.getElementById('searchInput').value.trim();
        const tbody = document.getElementById('resultBody');
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-primary">${t.searching}</td></tr>`;

        try {
            const params = new URLSearchParams({ q: query });
            const res = await fetch('/api/search?' + params.toString());
            
            if (!res.ok) throw new Error('HTTP ' + res.status);
            
            currentSearchResults = await res.json();
            renderResults();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger">${t.connFail} ${err.message}</td></tr>`;
        }
    }

    function renderResults() {
        const t = dict[currentLang];
        const tbody = document.getElementById('resultBody');
        tbody.innerHTML = '';

        if (!currentSearchResults || currentSearchResults.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger" id="initialText">${t.notFound}</td></tr>`;
            return;
        }

        currentSearchResults.forEach((item, index) => {
            const tr = document.createElement('tr');
            
            let structHtml = '-';
            if (item.smiles && item.smiles !== '-') {
                structHtml = `<canvas id="canvas-${index}" width="100" height="70" class="chem-canvas"></canvas>`;
            }

            tr.innerHTML = `
                <td><code>${item.barcode}</code></td>
                <td><b>${item.name}</b></td>
                <td>${item.cas_no}</td>
                <td class="text-center">${structHtml}</td>
                <td><span class="badge bg-warning text-dark">${item.safety_class}</span></td>
                <td><span class="badge bg-info text-dark">${item.location}</span></td>
                <td>${item.spec}</td>
                <td>${item.note}</td>
                <td>
                    <button type="button" class="btn btn-sm btn-outline-primary me-1" onclick="editChemical(${index})">${t.btnEdit}</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteChemical('${item.barcode}')">${t.btnDelete}</button>
                </td>
            `;
            tbody.appendChild(tr);

            if (item.smiles && item.smiles !== '-') {
                const cvs = document.getElementById(`canvas-${index}`);
                if (cvs) {
                    cvs.onclick = () => showBigStruct(item.name, item.smiles);
                }
            }
        });

        currentSearchResults.forEach((item, index) => {
            if (item.smiles && item.smiles !== '-') {
                SmilesDrawer.parse(item.smiles, function (tree) {
                    smilesDrawer.draw(tree, `canvas-${index}`, 'light', false);
                });
            }
        });
    }

    function showBigStruct(name, smiles) {
        document.getElementById('modalTitle').innerText = name + ' - 2D 化學結構';
        document.getElementById('modalSmiles').innerText = 'SMILES: ' + smiles;
        SmilesDrawer.parse(smiles, function (tree) {
            bigDrawer.draw(tree, 'modalCanvas', 'light', false);
        });
        const structModal = new bootstrap.Modal(document.getElementById('structModal'));
        structModal.show();
    }

    function previewStructure() {
        const smiles = document.getElementById('addSmiles').value.trim();
        const box = document.getElementById('previewBox');
        if (!smiles || smiles === '-') {
            box.style.display = 'none';
            return;
        }
        box.style.display = 'block';
        SmilesDrawer.parse(smiles, function (tree) {
            let pDrawer = new SmilesDrawer.Drawer({ width: 220, height: 150 });
            pDrawer.draw(tree, 'previewCanvas', 'light', false);
        });
    }

    function editChemical(index) {
        const item = currentSearchResults[index];
        document.getElementById('addBarcode').value = item.barcode;
        document.getElementById('addName').value = item.name;
        document.getElementById('addCas').value = item.cas_no === '-' ? '' : item.cas_no;
        document.getElementById('addSmiles').value = item.smiles === '-' ? '' : item.smiles;
        document.getElementById('addSafety').value = item.safety_class === '-' ? '' : item.safety_class;
        document.getElementById('addLocation').value = item.location === '-' ? '' : item.location;
        document.getElementById('addSpec').value = item.spec === '-' ? '' : item.spec;
        document.getElementById('addNote').value = item.note === '-' ? '' : item.note;
        
        previewStructure();
        document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
    }

    async function deleteChemical(barcode) {
        const t = dict[currentLang];
        if (!confirm(t.confirmDelete)) return;

        try {
            const res = await fetch('/api/delete_chemical/' + encodeURIComponent(barcode), { method: 'DELETE' });
            if (res.ok) searchChemical();
        } catch (err) {
            alert(t.connFail);
        }
    }

    async function addChemical(e) {
        e.preventDefault();
        const t = dict[currentLang];
        const barcodeInput = document.getElementById('addBarcode').value.trim();
        const nameInput = document.getElementById('addName').value.trim();

        const payload = {
            barcode: barcodeInput,
            name: nameInput,
            cas_no: document.getElementById('addCas').value.trim(),
            smiles: document.getElementById('addSmiles').value.trim(),
            safety_class: document.getElementById('addSafety').value.trim(),
            location: document.getElementById('addLocation').value.trim(),
            spec: document.getElementById('addSpec').value.trim(),
            note: document.getElementById('addNote').value.trim()
        };

        try {
            const res = await fetch('/api/add_chemical', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert(t.saveSuccess);
                document.getElementById('searchInput').value = barcodeInput;
                document.getElementById('addForm').reset();
                document.getElementById('previewBox').style.display = 'none';
                searchChemical();
            } else {
                alert(t.saveFail);
            }
        } catch (err) {
            alert(t.connFail + err.message);
        }
    }

    function toggleScanner() {
        const t = dict[currentLang];
        if (!isScanning) {
            document.getElementById('reader').style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    document.getElementById('searchInput').value = decodedText;
                    searchChemical();
                    toggleScanner();
                },
                (errorMessage) => {}
            );
            document.getElementById('btnScan').innerText = t.btnScanClose;
            document.getElementById('btnScan').classList.replace('btn-primary', 'btn-danger');
            isScanning = true;
        } else {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btnScan').innerText = t.btnScanOpen;
                    document.getElementById('btnScan').classList.replace('btn-danger', 'btn-primary');
                    isScanning = false;
                });
            }
        }
    }
</script>

</body>
</html>
