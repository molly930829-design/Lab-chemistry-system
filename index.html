<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Chemical Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1100px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
        .lang-btn { position: absolute; top: 25px; right: 30px; }
        .chem-canvas { cursor: pointer; background: #fff; border: 1px solid #dee2e6; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container position-relative">
    <button class="btn btn-outline-secondary lang-btn btn-sm" onclick="toggleLanguage()" id="langBtn">English</button>
    <h2 class="text-center mb-4" id="title">🧪 實驗室藥品精密管理系統</h2>

    <!-- 相機掃描區 -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white fw-bold" id="scanHeader">相機條碼掃描</div>
        <div class="card-body text-center">
            <button class="btn btn-primary w-100 mb-2" id="btnScan" onclick="toggleScanner()">開啟相機掃描</button>
            <div id="reader"></div>
        </div>
    </div>

    <!-- 搜尋區 -->
    <div class="mb-4">
        <label for="searchInput" class="form-label fw-bold" id="searchLabel">🔍 藥品搜尋 (支援名稱模糊搜尋、CAS No.、SMILES 結構式、條碼、擺放位置)</label>
        <div class="input-group">
            <input type="text" id="searchInput" class="form-control" placeholder="輸入關鍵字..." onkeypress="handleKeyPress(event)">
            <button class="btn btn-dark" type="button" onclick="searchChemical()" id="btnSearch">搜尋</button>
        </div>
    </div>

    <!-- 查詢結果表格 -->
    <h4 id="resultHeader">查詢結果</h4>
    <div class="table-responsive mb-4">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th id="thBarcode">條碼</th><th id="thName">名稱</th><th id="thCas">CAS No.</th>
                    <th id="thStructure">2D 化學結構</th><th id="thSafety">分類</th><th id="thLocation">位置</th>
                    <th id="thSpec">規格</th><th id="thNote">備註</th><th id="thAction">操作</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>

    <hr>

    <!-- 新增 / 修改藥品建檔 -->
    <h4 class="mb-3" id="addHeader">➕ 新增 / 修改藥品建檔</h4>
    <form id="addForm" onsubmit="addChemical(event)">
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label fw-bold">瓶身條碼 *</label><input type="text" id="addBarcode" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label fw-bold">藥品名稱 *</label><input type="text" id="addName" class="form-control" required></div>
            <div class="col-md-4">
                <label class="form-label fw-bold">CAS Number</label>
                <div class="input-group">
                    <input type="text" id="addCas" class="form-control">
                    <button class="btn btn-outline-info" type="button" onclick="fetchChemData()">查詢</button>
                </div>
            </div>
            <div class="col-md-6"><label class="form-label fw-bold">SMILES 結構式</label><input type="text" id="addSmiles" class="form-control" oninput="previewStructure()"></div>
            <div class="col-md-3"><label class="form-label fw-bold">安衛分類 *</label><input type="text" id="addSafety" list="safetyOptions" class="form-control" required><datalist id="safetyOptions"><option value="一般藥品"><option value="易燃液體"><option value="毒性物質"><option value="腐蝕性物質"></datalist></div>
            <div class="col-md-3"><label class="form-label fw-bold">擺放位置 *</label><input type="text" id="addLocation" list="locationOptions" class="form-control" required><datalist id="locationOptions"><option value="防爆櫃 A-1"><option value="藥品櫃 B-1"><option value="酸鹼櫃 C-1"></datalist></div>
            <div class="col-12 text-center" id="previewBox" style="display:none;"><label class="form-label fw-bold text-muted">即時預覽：</label><br><canvas id="previewCanvas" width="180" height="120" class="chem-canvas"></canvas></div>
            <div class="col-md-6"><label class="form-label">規格 / 純度</label><input type="text" id="addSpec" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">備註</label><input type="text" id="addNote" class="form-control"></div>
            <div class="col-12"><button type="submit" class="btn btn-success w-100 fw-bold">儲存建檔 / 更新資料</button></div>
        </div>
    </form>
</div>

<script>
    let smilesDrawer = new SmilesDrawer.Drawer({ width: 100, height: 70 });
    
    // 自動從 PubChem 查詢 SMILES
    async function fetchChemData() {
        const cas = document.getElementById('addCas').value.trim();
        if (!cas) return alert("請先輸入 CAS Number");
        
        try {
            // 查詢 CID
            const cidRes = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${cas}/cids/JSON`);
            const cidData = await cidRes.json();
            const cid = cidData.IdentifierList.CID[0];
            
            // 查詢 SMILES
            const smilesRes = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/CanonicalSMILES/JSON`);
            const smilesData = await smilesRes.json();
            const smiles = smilesData.PropertyTable.Properties[0].CanonicalSMILES;
            
            document.getElementById('addSmiles').value = smiles;
            previewStructure();
            alert("已成功取得結構資料！");
        } catch (e) {
            alert("找不到該 CAS 的化學結構，請手動輸入。");
        }
    }

    function previewStructure() {
        const smiles = document.getElementById('addSmiles').value.trim();
        const box = document.getElementById('previewBox');
        if (!smiles) { box.style.display = 'none'; return; }
        box.style.display = 'block';
        SmilesDrawer.parse(smiles, function (tree) { smilesDrawer.draw(tree, 'previewCanvas', 'light', false); });
    }

    // 其他邏輯保持不變 (略)
    async function searchChemical() { /* 原有搜尋邏輯 */ }
    async function addChemical(e) { /* 原有新增邏輯 */ }
    // ... (記得保留原有的搜尋與新增函式)
</script>
</body>
</html>
