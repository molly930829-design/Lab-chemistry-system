<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Chemical Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1100px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
    </style>
</head>
<body>

<div class="container position-relative">
    <h2 class="text-center mb-4">🧪 實驗室藥品精密管理系統</h2>

    <!-- 相機掃描區 -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white fw-bold">相機條碼掃描</div>
        <div class="card-body text-center">
            <button class="btn btn-primary w-100 mb-2" id="btnScan" onclick="toggleScanner()">開啟相機掃描</button>
            <div id="reader"></div>
        </div>
    </div>

    <!-- 模糊搜尋區 -->
    <div class="mb-4">
        <label for="searchInput" class="form-label fw-bold">🔍 藥品搜尋 (支援名稱模糊搜尋、CAS No.、SMILES 結構式、條碼、擺放位置)</label>
        <div class="input-group">
            <input type="text" id="searchInput" class="form-control" placeholder="輸入關鍵字（留空可列出所有藥品）..." onkeypress="handleKeyPress(event)">
            <button class="btn btn-dark" type="button" onclick="searchChemical()">搜尋</button>
        </div>
    </div>

    <!-- 查詢結果表格 -->
    <h4 id="resultHeader">查詢結果</h4>
    <div class="table-responsive mb-4">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>條碼</th>
                    <th>藥品名稱</th>
                    <th>CAS No.</th>
                    <th>SMILES 結構式</th>
                    <th>安衛分類</th>
                    <th>位置座標</th>
                    <th>規格</th>
                    <th>備註</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <tr><td colspan="9" class="text-center text-muted">請點擊搜尋或輸入關鍵字</td></tr>
            </tbody>
        </table>
    </div>

    <hr>

    <!-- 新增 / 修改藥品建檔 -->
    <h4 class="mb-3">➕ 新增 / 修改藥品建檔</h4>
    <form id="addForm" onsubmit="addChemical(event)">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-bold">瓶身條碼 *</label>
                <input type="text" id="addBarcode" class="form-control" placeholder="例如：CHEM-00001" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">藥品名稱 *</label>
                <input type="text" id="addName" class="form-control" placeholder="例如：tert-Butyl acetate" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">CAS Number</label>
                <input type="text" id="addCas" class="form-control" placeholder="例如：540-88-5">
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">SMILES 結構式</label>
                <input type="text" id="addSmiles" class="form-control" placeholder="例如：CC(C)(C)OC(=O)C">
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">安衛分類 *</label>
                <select id="addSafety" class="form-select" required>
                    <option value="">-- 請選擇分類 --</option>
                    <option value="一般藥品">一般藥品 (General)</option>
                    <option value="易燃液體">易燃液體 (Flammable)</option>
                    <option value="毒性物質">毒性物質 (Toxic)</option>
                    <option value="腐蝕性物質">腐蝕性物質 (Corrosive)</option>
                    <option value="強氧化劑">強氧化劑 (Oxidizer)</option>
                    <option value="禁水性物質">禁水性物質 (Water-reactive)</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">擺放位置座標 *</label>
                <select id="addLocation" class="form-select" required>
                    <option value="">-- 請選擇位置 --</option>
                    <option value="防爆櫃 A-1">防爆櫃 A-1</option>
                    <option value="防爆櫃 A-2">防爆櫃 A-2</option>
                    <option value="藥品櫃 B-1">藥品櫃 B-1</option>
                    <option value="藥品櫃 B-2">藥品櫃 B-2</option>
                    <option value="酸鹼櫃 C-1">酸鹼櫃 C-1</option>
                    <option value="冷藏冰箱 R-1">冷藏冰箱 R-1</option>
                    <option value="冷凍冰箱 F-1">冷凍冰箱 F-1</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">規格 / 純度</label>
                <input type="text" id="addSpec" class="form-control" placeholder="例如：500mL / 99%">
            </div>
            <div class="col-md-6">
                <label class="form-label">備註</label>
                <input type="text" id="addNote" class="form-control" placeholder="例如：開瓶日期、保管人...">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-success w-100 fw-bold">儲存建檔 / 更新資料</button>
            </div>
        </div>
    </form>
</div>

<script>
    let currentSearchResults = [];
    let html5QrCode;
    let isScanning = false;

    function handleKeyPress(e) {
        if (e.key === 'Enter') searchChemical();
    }

    async function searchChemical() {
        const query = document.getElementById('searchInput').value.trim();
        const tbody = document.getElementById('resultBody');
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-primary">搜尋中...</td></tr>';

        try {
            const res = await fetch('/api/search?q=' + encodeURIComponent(query));
            currentSearchResults = await res.json();
            renderResults();
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-danger">搜尋連線失敗：' + err.message + '</td></tr>';
        }
    }

    function renderResults() {
        const tbody = document.getElementById('resultBody');
        tbody.innerHTML = '';

        if (!currentSearchResults || currentSearchResults.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-danger">查無相關藥品資料</td></tr>';
            return;
        }

        currentSearchResults.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td><code>${item.barcode}</code></td>
                    <td><b>${item.name}</b></td>
                    <td>${item.cas_no}</td>
                    <td><code>${item.smiles}</code></td>
                    <td><span class="badge bg-warning text-dark">${item.safety_class}</span></td>
                    <td><span class="badge bg-info text-dark">${item.location}</span></td>
                    <td>${item.spec}</td>
                    <td>${item.note}</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-outline-primary me-1" onclick="editChemical(${index})">編輯</button>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteChemical('${item.barcode}')">刪除</button>
                    </td>
                </tr>
            `;
        });
    }

    function editChemical(index) {
        const item = currentSearchResults[index];
        document.getElementById('addBarcode').value = item.barcode;
        document.getElementById('addName').value = item.name;
        document.getElementById('addCas').value = item.cas_no === '-' ? '' : item.cas_no;
        document.getElementById('addSmiles').value = item.smiles === '-' ? '' : item.smiles;
        document.getElementById('addSafety').value = item.safety_class === '-' ? '' : item.safety_class;
        document.getElementById('addLocation').value = item.location === '-' ? '' : item.location;
        document.getElementById('addSpec').value = item.spec === '-' ? '' : item.spec;
        document.getElementById('addNote').value = item.note === '-' ? '' : item.note;
        
        document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
    }

    async function deleteChemical(barcode) {
        if (!confirm('確定要刪除這筆藥品資料嗎？')) return;

        try {
            const res = await fetch('/api/delete_chemical/' + encodeURIComponent(barcode), { method: 'DELETE' });
            if (res.ok) searchChemical();
        } catch (err) {
            alert('刪除失敗');
        }
    }

    async function addChemical(e) {
        e.preventDefault();
        const barcodeInput = document.getElementById('addBarcode').value.trim();
        const nameInput = document.getElementById('addName').value.trim();

        const payload = {
            barcode: barcodeInput,
            name: nameInput,
            cas_no: document.getElementById('addCas').value.trim(),
            smiles: document.getElementById('addSmiles').value.trim(),
            safety_class: document.getElementById('addSafety').value,
            location: document.getElementById('addLocation').value,
            spec: document.getElementById('addSpec').value.trim(),
            note: document.getElementById('addNote').value.trim()
        };

        try {
            const res = await fetch('/api/add_chemical', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('儲存成功！');
                document.getElementById('searchInput').value = barcodeInput;
                document.getElementById('addForm').reset();
                searchChemical();
            } else {
                alert('儲存失敗');
            }
        } catch (err) {
            alert('連線失敗：' + err.message);
        }
    }

    function toggleScanner() {
        if (!isScanning) {
            document.getElementById('reader').style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    document.getElementById('searchInput').value = decodedText;
                    searchChemical();
                    toggleScanner();
                },
                (errorMessage) => {}
            );
            document.getElementById('btnScan').innerText = "關閉相機";
            document.getElementById('btnScan').classList.replace('btn-primary', 'btn-danger');
            isScanning = true;
        } else {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btnScan').innerText = "開啟相機掃描";
                    document.getElementById('btnScan').classList.replace('btn-danger', 'btn-primary');
                    isScanning = false;
                });
            }
        }
    }
</script>

</body>
</html>
